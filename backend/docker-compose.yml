services:
  postgres:
    image: postgres:16-alpine
    container_name: den_postgres
    restart: always
    environment:
      POSTGRES_DB: den_db
      POSTGRES_USER: den_user
      POSTGRES_PASSWORD: den_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - den_pgdata:/var/lib/postgresql/data

volumes:
  den_pgdata:
